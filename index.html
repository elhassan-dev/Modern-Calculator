<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/l5wg2pve/image/upload/v1788971669/file_00000000d9e082438bcfce03f74d0654_lhjd2j.png">
    <script src="index.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Modern Calculator</title>
</head>
<body>
    <header>
        <div class="brandn"> <img src="https://res.cloudinary.com/l5wg2pve/image/upload/v1789050142/20260910_152026_cqm1gd.png" alt="Brand logo"></div>
        
        <div>
        <div class="sunlight">
            <button id="toggle"><img src="https://res.cloudinary.com/l5wg2pve/image/upload/v1789048042/20260910_144127_avg3xi.png" alt="sun"></button>
            </div>
            <div class="night">
            <button id="toggle2"><img src="https://res.cloudinary.com/l5wg2pve/image/upload/v1789048042/20260910_144041_we08zi.png" alt="sun"></button>
            </div>
            </div>
    </header>
    <main>
        <div class="display">
            <h1 id="input">0</h1>
            <p id="answer">0</p>
        </div>
        <div class="operators">
        <div class="firstbtn">
            <button id="delete">⌫</button>
            <button id="clear">C</button>
        </div>
        <div class="btnkeys">
           <div class="numbers">
            <button class="numb" value="1">1</button><!--  -->
            <button class="numb" value="2">2</button>
            <button class="numb" value="3">3</button>
            <button class="numb" value="4">4</button>
            <button class="numb" value="5">5</button>
            <button class="numb" value="6">6</button>
            <button class="numb" value="7">7</button>
            <button class="numb" value="8">8</button>
            <button  class="numb" value="9">9</button>
            <button class="numb" id="prod">=</button>
            <button class="numb" value="0">0</button>
            <button class="numb" value="/100">%</button>
           </div>
           <div class="signs">
            <button class="numb" value="+">+</button>
            <button class="numb" value="-">-</button>
            <button class="numb" value="/">÷</button>
            <button class="numb" value="*">×</button>
           </div>
        </div>
        </div>
    </main>
</body>
</html>
